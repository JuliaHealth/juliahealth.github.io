<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 640 380" font-family="system-ui, -apple-system, 'Segoe UI', sans-serif">
  <!-- gridlines -->
  <g stroke="#e1e0d9" stroke-width="1">
    <line x1="70" y1="40"  x2="610" y2="40"/>
    <line x1="70" y1="110" x2="610" y2="110"/>
    <line x1="70" y1="180" x2="610" y2="180"/>
    <line x1="70" y1="250" x2="610" y2="250"/>
  </g>
  <line x1="70" y1="320" x2="610" y2="320" stroke="#c3c2b7" stroke-width="1.5"/>

  <!-- y tick labels -->
  <g font-size="11.5" fill="#898781" text-anchor="end" font-variant-numeric="tabular-nums">
    <text x="62" y="44">100</text>
    <text x="62" y="114">95</text>
    <text x="62" y="184">90</text>
    <text x="62" y="254">85</text>
    <text x="62" y="324">80</text>
  </g>
  <text x="20" y="185" font-size="11.5" fill="#52514e" transform="rotate(-90 20 185)" text-anchor="middle">test accuracy (%)</text>

  <!-- legend -->
  <g font-size="12" fill="#0b0b0b">
    <circle cx="88" cy="18" r="6" fill="#2a78d6"/>
    <text x="100" y="22">CapsNet</text>
    <circle cx="182" cy="18" r="6" fill="#eb6834"/>
    <text x="194" y="22">LeNet</text>
  </g>

  <!-- group: 1% -->
  <line x1="160" y1="158" x2="160" y2="272" stroke="#c3c2b7" stroke-width="2"/>
  <circle cx="160" cy="158" r="7" fill="#2a78d6"/>
  <circle cx="160" cy="272" r="7" fill="#eb6834"/>
  <text x="174" y="162" font-size="12.5" fill="#0b0b0b" font-variant-numeric="tabular-nums">91.6</text>
  <text x="174" y="276" font-size="12.5" fill="#0b0b0b" font-variant-numeric="tabular-nums">83.5</text>
  <text x="134" y="215" font-size="11" fill="#2a78d6" font-weight="600" text-anchor="end">+8.1</text>

  <!-- group: 5% -->
  <line x1="340" y1="72" x2="340" y2="128" stroke="#c3c2b7" stroke-width="2"/>
  <circle cx="340" cy="72" r="7" fill="#2a78d6"/>
  <circle cx="340" cy="128" r="7" fill="#eb6834"/>
  <text x="354" y="76" font-size="12.5" fill="#0b0b0b" font-variant-numeric="tabular-nums">97.7</text>
  <text x="354" y="132" font-size="12.5" fill="#0b0b0b" font-variant-numeric="tabular-nums">93.7</text>
  <text x="314" y="104" font-size="11" fill="#2a78d6" font-weight="600" text-anchor="end">+4.0</text>

  <!-- group: 10% -->
  <line x1="520" y1="61" x2="520" y2="95" stroke="#c3c2b7" stroke-width="2"/>
  <circle cx="520" cy="61" r="7" fill="#2a78d6"/>
  <circle cx="520" cy="95" r="7" fill="#eb6834"/>
  <text x="534" y="65" font-size="12.5" fill="#0b0b0b" font-variant-numeric="tabular-nums">98.5</text>
  <text x="534" y="99" font-size="12.5" fill="#0b0b0b" font-variant-numeric="tabular-nums">96.1</text>
  <text x="494" y="82" font-size="11" fill="#2a78d6" font-weight="600" text-anchor="end">+2.4</text>

  <!-- x labels -->
  <g font-size="12.5" fill="#0b0b0b" text-anchor="middle" font-weight="600">
    <text x="160" y="344">1%</text>
    <text x="340" y="344">5%</text>
    <text x="520" y="344">10%</text>
  </g>
  <text x="340" y="366" font-size="11.5" fill="#898781" text-anchor="middle">fraction of the MNIST training set (10 epochs, seed 1; test set always the full 10,000 images)</text>
</svg>
