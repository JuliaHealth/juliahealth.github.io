<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 920 372" font-family="system-ui, -apple-system, 'Segoe UI', sans-serif">
  <defs>
    <marker id="arr" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M 0 1 L 9 5 L 0 9 z" fill="#52514e"/>
    </marker>
    <marker id="arrO" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M 0 1 L 9 5 L 0 9 z" fill="#eb6834"/>
    </marker>
  </defs>

  <!-- ======== encoder row ======== -->
  <!-- input -->
  <rect x="18" y="66" width="92" height="104" rx="9" fill="#fcfcfb" stroke="#c3c2b7" stroke-width="1.4"/>
  <text x="64" y="106" text-anchor="middle" font-size="12.5" font-weight="600" fill="#0b0b0b">Input</text>
  <text x="64" y="124" text-anchor="middle" font-size="11.5" fill="#52514e">28×28×1</text>
  <text x="64" y="142" text-anchor="middle" font-size="10.5" fill="#898781">grayscale</text>

  <!-- conv1 -->
  <rect x="142" y="66" width="118" height="104" rx="9" fill="#e8f0fb" stroke="#2a78d6" stroke-width="1.4"/>
  <text x="201" y="98" text-anchor="middle" font-size="12.5" font-weight="600" fill="#0b0b0b">Conv 1</text>
  <text x="201" y="116" text-anchor="middle" font-size="11" fill="#52514e">9×9 · 256 ch</text>
  <text x="201" y="132" text-anchor="middle" font-size="11" fill="#52514e">stride 1 · ReLU</text>
  <text x="201" y="152" text-anchor="middle" font-size="10.5" fill="#898781">→ 20×20×256</text>

  <!-- conv2 / primary caps -->
  <rect x="292" y="66" width="118" height="104" rx="9" fill="#e8f0fb" stroke="#2a78d6" stroke-width="1.4"/>
  <text x="351" y="98" text-anchor="middle" font-size="12.5" font-weight="600" fill="#0b0b0b">Conv 2</text>
  <text x="351" y="116" text-anchor="middle" font-size="11" fill="#52514e">9×9 · 256 ch</text>
  <text x="351" y="132" text-anchor="middle" font-size="11" fill="#52514e">stride 2 · ReLU</text>
  <text x="351" y="152" text-anchor="middle" font-size="10.5" fill="#898781">→ 6×6×256</text>

  <!-- primary capsules -->
  <rect x="442" y="66" width="128" height="104" rx="9" fill="#d5e5f8" stroke="#2a78d6" stroke-width="1.6"/>
  <text x="506" y="96" text-anchor="middle" font-size="12.5" font-weight="600" fill="#0b0b0b">PrimaryCaps</text>
  <text x="506" y="114" text-anchor="middle" font-size="11" fill="#52514e">1152 capsules</text>
  <text x="506" y="130" text-anchor="middle" font-size="11" fill="#52514e">8-D each</text>
  <text x="506" y="150" text-anchor="middle" font-size="10.5" fill="#898781">squash(·)</text>

  <!-- class capsules -->
  <rect x="668" y="66" width="118" height="104" rx="9" fill="#d5e5f8" stroke="#2a78d6" stroke-width="1.6"/>
  <text x="727" y="96" text-anchor="middle" font-size="12.5" font-weight="600" fill="#0b0b0b">ClassCaps</text>
  <text x="727" y="114" text-anchor="middle" font-size="11" fill="#52514e">n classes</text>
  <text x="727" y="130" text-anchor="middle" font-size="11" fill="#52514e">16-D each</text>
  <text x="727" y="150" text-anchor="middle" font-size="10.5" fill="#898781">W: 16×8×1152×n</text>

  <!-- prediction -->
  <rect x="816" y="66" width="88" height="104" rx="9" fill="#fcfcfb" stroke="#c3c2b7" stroke-width="1.4"/>
  <text x="860" y="102" text-anchor="middle" font-size="12.5" font-weight="600" fill="#0b0b0b">Lengths</text>
  <text x="860" y="122" text-anchor="middle" font-size="11.5" fill="#52514e">‖vₖ‖</text>
  <text x="860" y="142" text-anchor="middle" font-size="10.5" fill="#898781">argmax → class</text>

  <!-- encoder arrows -->
  <line x1="110" y1="118" x2="136" y2="118" stroke="#52514e" stroke-width="1.6" marker-end="url(#arr)"/>
  <line x1="260" y1="118" x2="286" y2="118" stroke="#52514e" stroke-width="1.6" marker-end="url(#arr)"/>
  <line x1="410" y1="118" x2="436" y2="118" stroke="#52514e" stroke-width="1.6" marker-end="url(#arr)"/>
  <line x1="570" y1="118" x2="662" y2="118" stroke="#52514e" stroke-width="1.6" marker-end="url(#arr)"/>
  <text x="616" y="104" text-anchor="middle" font-size="10.5" font-weight="600" fill="#2a78d6">dynamic routing</text>
  <text x="616" y="138" text-anchor="middle" font-size="10.5" fill="#898781">3 iterations</text>
  <line x1="786" y1="118" x2="810" y2="118" stroke="#52514e" stroke-width="1.6" marker-end="url(#arr)"/>

  <!-- margin loss tag -->
  <rect x="798" y="16" width="124" height="0" fill="none"/>
  <text x="860" y="40" text-anchor="middle" font-size="10.5" fill="#898781">margin loss</text>
  <text x="860" y="54" text-anchor="middle" font-size="10.5" fill="#898781">m⁺ 0.9 · m⁻ 0.1 · λ 0.5</text>
  <line x1="860" y1="60" x2="860" y2="62" stroke="none"/>

  <!-- ======== decoder branch ======== -->
  <path d="M 727 170 L 727 214" stroke="#eb6834" stroke-width="1.6" fill="none" marker-end="url(#arrO)"/>
  <text x="741" y="196" font-size="10.5" fill="#eb6834">mask by label</text>

  <rect x="646" y="220" width="162" height="88" rx="9" fill="#fdeee7" stroke="#eb6834" stroke-width="1.4"/>
  <text x="727" y="248" text-anchor="middle" font-size="12.5" font-weight="600" fill="#0b0b0b">Decoder</text>
  <text x="727" y="266" text-anchor="middle" font-size="11" fill="#52514e">Dense 512 → 1024 → 784</text>
  <text x="727" y="284" text-anchor="middle" font-size="11" fill="#52514e">ReLU · ReLU · sigmoid</text>

  <path d="M 640 264 L 490 264" stroke="#eb6834" stroke-width="1.6" fill="none" marker-end="url(#arrO)"/>
  <text x="565" y="252" text-anchor="middle" font-size="10.5" fill="#eb6834">reconstruction x̂</text>

  <rect x="384" y="220" width="100" height="88" rx="9" fill="#fcfcfb" stroke="#c3c2b7" stroke-width="1.4"/>
  <text x="434" y="252" text-anchor="middle" font-size="12" font-weight="600" fill="#0b0b0b">28×28</text>
  <text x="434" y="270" text-anchor="middle" font-size="10.5" fill="#52514e">SSE vs input</text>
  <text x="434" y="288" text-anchor="middle" font-size="10.5" fill="#898781">weight α = 0.0005</text>

  <!-- training-only note -->
  <text x="384" y="330" font-size="10.5" fill="#898781">Decoder branch regularizes training only; at test time the mask uses the predicted class.</text>
</svg>
